workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Setup Android Properly and Fix Main Activity
        script: |
          # 1. إنشاء منصة أندرويد بشكل كامل ونظيف
          flutter create . --platforms=android --org com.example.storeapp
          
          # 2. التأكد من وجود مسار MainActivity لربط تطبيق فلاتر بنجاح
          mkdir -p android/app/src/main/java/com/example/store_app
          
          # 3. كتابة ملف MainActivity.kt الأساسي لمنع الإغلاق الفوري
          cat << 'EOF' > android/app/src/main/java/com/example/store_app/MainActivity.kt
          package com.example.storeapp

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

          # 4. تعديل ملف app/build.gradle.kts بـ SDK 36
          mkdir -p android/app
          cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.storeapp"
              compileSdk = 36

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlin {
                  compilerOptions {
                      jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
                  }
              }

              defaultConfig {
                  applicationId = "com.example.storeapp"
                  minSdk = flutter.minSdkVersion
                  targetSdk = 36
                  versionCode = flutter.versionCode.toInt()
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          # 5. ضبط إعدادات جذر المشروع
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                          compileSdkVersion 36
                          if (defaultConfig.targetSdkVersion == null || defaultConfig.targetSdkVersion.apiLevel < 36) {
                              defaultConfig.targetSdkVersion = 36
                          }
                      }
                  }
              }
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF
          echo "Android environment and MainActivity configured successfully"
      - name: Get Flutter packages
        script: flutter packages get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
