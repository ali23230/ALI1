workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Setup Android Only If Missing
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.example.storeapp
          fi
      - name: Get Flutter packages
        script: flutter packages get
      - name: Force Override build.gradle.kts to SDK 36
        script: |
          mkdir -p android/app
          cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.storeapp"
              compileSdk = 36

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlin {
                  compilerOptions {
                      jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
                  }
              }

              defaultConfig {
                  applicationId = "com.example.storeapp"
                  minSdk = flutter.minSdkVersion
                  targetSdk = 36
                  versionCode = flutter.versionCode.toInt()
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF
          echo "Overrode build.gradle.kts to SDK 36 right before build"
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
     
