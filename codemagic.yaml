workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Clean & Recreate Android Folder
        script: |
          # حذف مجلد أندرويد القديم كلياً لتنظيف أي إعدادات تالفة
          rm -rf android
          # إعادة إنشاء هيكل أندرويد نظيف وحديث بالكامل
          flutter create . --platforms=android
      - name: Setup Keystore
        script: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass store123 -keypass store123 -dname "CN=StoreApp, OU=Dev, O=Store, L=Annaba, C=DZ"
      - name: Get Flutter packages
        script: flutter packages get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      # update v4
