workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Initialize Android Platform
        script: flutter create . --platforms=android --org com.example.storeapp
      - name: Force Update compileSdk
        script: |
          find android -name "build.gradle*" -exec sed -i '' 's/compileSdk = [0-9]*/compileSdk = 34/g' {} +
          find android -name "build.gradle*" -exec sed -i '' 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' {} +
          find android -name "build.gradle*" -exec sed -i '' 's/targetSdk = [0-9]*/targetSdk = 34/g' {} +
          find android -name "build.gradle*" -exec sed -i '' 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' {} +
      - name: Get Flutter packages
        script: flutter packages get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
