workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create Android platform structure
        script: flutter create . --platforms=android --org com.example.storeapp
      - name: Update Android SDK compile version
        script: |
          if [ -f android/app/build.gradle ]; then
            sed -i '' 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i '' 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' android/app/build.gradle || true
          fi
      - name: Get Flutter packages
        script: flutter packages get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
