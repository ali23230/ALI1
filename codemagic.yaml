workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Initialize Android Platform
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.example.storeapp
          fi
      - name: Clean and Fix build.gradle.kts using Python
        script: |
          python3 -c '
          import re, os
          path = "android/app/build.gradle.kts"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
              # استبدال سطر compileSdk بالكامل بنظافة وبدون تشويه
              content = re.sub(r"compileSdk\s*=.*", "compileSdk = 36", content)
              content = re.sub(r"targetSdk\s*=.*", "targetSdk = 36", content)
              with open(path, "w") as f:
                  f.write(content)
              print("Successfully updated SDK to 36")
          '
      - name: Get Flutter packages
        script: flutter packages get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
     
