workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Initialize Android Platform
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.example.storeapp
          fi
      - name: Force Update SDK to 36 in build.gradle.kts
        script: |
          FILE_PATH="android/app/build.gradle.kts"
          if [ -f "$FILE_PATH" ]; then
            sed -i '' 's/compileSdk = [0-9]*/compileSdk = 36/g' "$FILE_PATH"
            sed -i '' 's/targetSdk = [0-9]*/targetSdk = 36/g' "$FILE_PATH"
            echo "Updated SDK successfully to 36"
          else
            echo "File not found!"
          fi
      - name: Get Flutter packages
        script: flutter packages get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
     
