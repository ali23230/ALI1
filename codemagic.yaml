workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Generate Persistent Keystore & Setup Android
        script: |
          # 1. إنشاء منصة أندرويد
          flutter create . --platforms=android --org com.example.storeapp
          
          # 2. إنشاء مفتاح توقيع رقمي ثابت بدلاً من المفتاح العشوائي
          keytool -genkey -v -keystore android/app/key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass store123 -keypass store123 -dname "CN=StoreApp, OU=Dev, O=Store, L=Annaba, C=DZ"

          # 3. إنشاء MainActivity.kt
          mkdir -p android/app/src/main/java/com/example/storeapp
          cat << 'EOF' > android/app/src/main/java/com/example/storeapp/MainActivity.kt
          package com.example.storeapp

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

          # 4. ضبط build.gradle.kts لاستخدام مفتاح التوقيع الثابت
          mkdir -p android/app
          cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.storeapp"
              compileSdk = 36

              signingConfigs {
                  create("release") {
                      storeFile = file("key.jks")
                      storePassword = "store123"
                      keyAlias = "key"
                      keyPassword = "store123"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlin {
                  compilerOptions {
                      jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
                  }
              }

              defaultConfig {
                  applicationId = "com.example.storeapp"
                  minSdk = flutter.minSdkVersion
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          # 5. ضبط إعدادات جذر المشروع
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                          compileSdkVersion 36
                          if (defaultConfig.targetSdkVersion == null || defaultConfig.targetSdkVersion.apiLevel < 36) {
                              defaultConfig.targetSdkVersion = 36
                          }
                      }
                  }
              }
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF
          echo "Persistent signing keystore created successfully"
      - name: Get Flutter packages
        script: flutter packages get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
